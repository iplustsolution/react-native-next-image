<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="298" viewBox="0 0 1300 298" role="img" aria-labelledby="t d">
  <title id="t">How react-native-next-image resolves a request</title>
  <desc id="d">Every request checks memory first, then disk, then the network, and stops at the first hit. Memory renders with no I/O, disk renders offline and after a restart, and the network is only used when the entry is missing or expired.</desc>
  <defs>
  <filter id="sh" x="-15%" y="-15%" width="130%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.30"/>
    <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.22"/>
  </filter>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#103322"/><stop offset="1" stop-color="#05150C"/>
  </linearGradient>
  <linearGradient id="faceA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#134A2C"/><stop offset="1" stop-color="#061C10"/>
  </linearGradient>
  <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B5A2E"/><stop offset="1" stop-color="#03200F"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C9FFE0" stop-opacity="0.38"/>
    <stop offset="0.3" stop-color="#C9FFE0" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#C9FFE0" stop-opacity="0.02"/>
  </linearGradient>
  <radialGradient id="sheen" cx="0.18" cy="0" r="0.95">
    <stop offset="0" stop-color="#22E07D" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#22E07D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#22DB73"/><stop offset="1" stop-color="#00822F"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F0FFF5"/><stop offset="1" stop-color="#22E07D"/>
  </linearGradient>
  <linearGradient id="logoFg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E6FFEE"/><stop offset="1" stop-color="#82E7B0"/>
  </linearGradient>
  </defs>
  <style>
    .s { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
<g transform="translate(10 4)">
<g filter="url(#sh)"><rect x="24" y="19" width="196" height="232" rx="24" fill="url(#slab)"/><rect x="24" y="12" width="196" height="232" rx="24" fill="url(#face)"/></g>
<rect x="24" y="12" width="196" height="232" rx="24" fill="url(#sheen)"/>
<rect x="24.75" y="12.75" width="194.5" height="230.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g transform="translate(48 38)"><rect y="4.5" width="56" height="56" rx="15.1" fill="#004F1C"/><rect width="56" height="56" rx="15.1" fill="url(#tile)"/><rect x="3.9" y="2.2" width="48.2" height="26.9" rx="12.1" fill="url(#gloss)" opacity="0.55"/><rect x=".75" y=".75" width="54.5" height="54.5" rx="14.4" fill="none" stroke="#9BF7C4" stroke-opacity="0.6" stroke-width="1.5"/><g transform="translate(13.44 13.44) scale(1.2133)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)" color="#00561F" opacity="0.75"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 15.5l-4.8-4.8L7 20"/></g><g color="#F2FFF7"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 15.5l-4.8-4.8L7 20"/></g></g></g>
<text class="m" x="48" y="130" font-size="12" letter-spacing="1.6" fill="#4ADE80">REQUEST</text>
<text class="s" x="48" y="158" font-size="21" font-weight="800" fill="#F3FFF7">&lt;NextImage&gt;</text>
<text class="m" x="48" y="188" font-size="13" fill="#6FA487">source.uri</text>
<text class="m" x="48" y="210" font-size="13" fill="#6FA487">or cacheKey</text>
<g filter="url(#sh)"><rect x="264" y="19" width="300" height="232" rx="24" fill="url(#slab)"/><rect x="264" y="12" width="300" height="232" rx="24" fill="url(#faceA)"/></g>
<rect x="264" y="12" width="300" height="232" rx="24" fill="url(#sheen)"/>
<rect x="264.75" y="12.75" width="298.5" height="230.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g transform="translate(288 38)"><rect y="4.5" width="56" height="56" rx="15.1" fill="#004F1C"/><rect width="56" height="56" rx="15.1" fill="url(#tile)"/><rect x="3.9" y="2.2" width="48.2" height="26.9" rx="12.1" fill="url(#gloss)" opacity="0.55"/><rect x=".75" y=".75" width="54.5" height="54.5" rx="14.4" fill="none" stroke="#9BF7C4" stroke-opacity="0.6" stroke-width="1.5"/><g transform="translate(13.44 13.44) scale(1.2133)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)" color="#00561F" opacity="0.75"><path d="M13 2.5L4.5 13.5H12l-1 8 8.5-11H12z"/></g><g color="#F2FFF7"><path d="M13 2.5L4.5 13.5H12l-1 8 8.5-11H12z"/></g></g></g>
<text class="m" x="360" y="60" font-size="12" letter-spacing="1.6" fill="#4ADE80">1 · MEMORY</text>
<text class="s" x="360" y="88" font-size="22" font-weight="800" fill="#F3FFF7">Memory hit</text>
<text class="s" x="288" y="136" font-size="16.5" fill="#B5D6C3">Renders in the same frame, with</text>
<text class="s" x="288" y="160" font-size="16.5" fill="#B5D6C3">no I/O at all.</text>
<rect x="288.0" y="194" width="149.8" height="28" rx="9" fill="#0BBF64" fill-opacity="0.16"/><text class="s" x="362.9" y="212.7" text-anchor="middle" font-size="13" font-weight="600" fill="#9AF5C3">cacheType: memory</text>
<g filter="url(#sh)"><rect x="608" y="19" width="300" height="232" rx="24" fill="url(#slab)"/><rect x="608" y="12" width="300" height="232" rx="24" fill="url(#face)"/></g>
<rect x="608" y="12" width="300" height="232" rx="24" fill="url(#sheen)"/>
<rect x="608.75" y="12.75" width="298.5" height="230.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g transform="translate(632 38)"><rect y="4.5" width="56" height="56" rx="15.1" fill="#004F1C"/><rect width="56" height="56" rx="15.1" fill="url(#tile)"/><rect x="3.9" y="2.2" width="48.2" height="26.9" rx="12.1" fill="url(#gloss)" opacity="0.55"/><rect x=".75" y=".75" width="54.5" height="54.5" rx="14.4" fill="none" stroke="#9BF7C4" stroke-opacity="0.6" stroke-width="1.5"/><g transform="translate(13.44 13.44) scale(1.2133)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)" color="#00561F" opacity="0.75"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><g color="#F2FFF7"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g></g></g>
<text class="m" x="704" y="60" font-size="12" letter-spacing="1.6" fill="#4ADE80">2 · DISK</text>
<text class="s" x="704" y="88" font-size="22" font-weight="800" fill="#F3FFF7">Disk hit</text>
<text class="s" x="632" y="136" font-size="16.5" fill="#B5D6C3">Renders with no network</text>
<text class="s" x="632" y="160" font-size="16.5" fill="#B5D6C3">connection, offline and after a</text>
<text class="s" x="632" y="184" font-size="16.5" fill="#B5D6C3">restart.</text>
<rect x="632.0" y="194" width="135.2" height="28" rx="9" fill="#0BBF64" fill-opacity="0.16"/><text class="s" x="699.6" y="212.7" text-anchor="middle" font-size="13" font-weight="600" fill="#9AF5C3">cacheType: disk</text>
<g filter="url(#sh)"><rect x="952" y="19" width="300" height="232" rx="24" fill="url(#slab)"/><rect x="952" y="12" width="300" height="232" rx="24" fill="url(#face)"/></g>
<rect x="952" y="12" width="300" height="232" rx="24" fill="url(#sheen)"/>
<rect x="952.75" y="12.75" width="298.5" height="230.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<g transform="translate(976 38)"><rect y="4.5" width="56" height="56" rx="15.1" fill="#004F1C"/><rect width="56" height="56" rx="15.1" fill="url(#tile)"/><rect x="3.9" y="2.2" width="48.2" height="26.9" rx="12.1" fill="url(#gloss)" opacity="0.55"/><rect x=".75" y=".75" width="54.5" height="54.5" rx="14.4" fill="none" stroke="#9BF7C4" stroke-opacity="0.6" stroke-width="1.5"/><g transform="translate(13.44 13.44) scale(1.2133)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)" color="#00561F" opacity="0.75"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></g><g color="#F2FFF7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></g></g></g>
<text class="m" x="1048" y="60" font-size="12" letter-spacing="1.6" fill="#4ADE80">3 · NETWORK</text>
<text class="s" x="1048" y="88" font-size="22" font-weight="800" fill="#F3FFF7">Download</text>
<text class="s" x="976" y="136" font-size="16.5" fill="#B5D6C3">Only when the entry is missing</text>
<text class="s" x="976" y="160" font-size="16.5" fill="#B5D6C3">or its lifetime has expired.</text>
<rect x="976.0" y="194" width="157.0" height="28" rx="9" fill="#0BBF64" fill-opacity="0.16"/><text class="s" x="1054.5" y="212.7" text-anchor="middle" font-size="13" font-weight="600" fill="#9AF5C3">cacheType: network</text>
<circle cx="242.0" cy="131.0" r="16" fill="#003D16"/><circle cx="242.0" cy="128.0" r="16" fill="url(#tile)"/><g transform="translate(234.0 120.0) scale(0.667)" fill="none" stroke="#F2FFF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
<circle cx="586.0" cy="131.0" r="16" fill="#003D16"/><circle cx="586.0" cy="128.0" r="16" fill="url(#tile)"/><g transform="translate(578.0 120.0) scale(0.667)" fill="none" stroke="#F2FFF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
<text class="m" x="586.0" y="102.0" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#6FA487">MISS</text>
<circle cx="930.0" cy="131.0" r="16" fill="#003D16"/><circle cx="930.0" cy="128.0" r="16" fill="url(#tile)"/><g transform="translate(922.0 120.0) scale(0.667)" fill="none" stroke="#F2FFF7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
<text class="m" x="930.0" y="102.0" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#6FA487">MISS</text>
</g>
</svg>
