<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="632" viewBox="0 0 1300 632" role="img" aria-labelledby="t d">
  <title id="t">react-native-next-image features</title>
  <desc id="d">Cache-first loading: Each URL is downloaded once per cache lifetime, then served from memory or disk, even offline and after a restart.; Viewport-aware prefetch: Images a few screens away download early. Images further off wait, and never open a connection.; Secure by default: HTTPS only, private networks blocked, headers sanitised, no downgrade redirects, optional certificate pinning.; New Architecture native: A Fabric view and a Turbo Module, backed by Coil 3 on Android and Kingfisher 8 on iOS.; Effects and transitions: Native blur, grayscale, tint, rounded corners and circles, with fade, slide, scale and gravity.; Observable and in control: onLoad says memory, disk or network. Progress, retries with backoff, error codes and a full cache API.</desc>
  <defs>
  <filter id="sh" x="-15%" y="-15%" width="130%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.30"/>
