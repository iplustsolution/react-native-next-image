buildscript {
  ext.NextImage = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return NextImage[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// Coil 3.2 is the newest release built with Kotlin 2.1, which is what React
// Native 0.80 through 0.85 ship. Later Coil releases need a Kotlin 2.2+ compiler.
def coilVersion = "3.2.0"
def okhttpVersion = "4.12.0"
def coroutinesVersion = "1.10.2"

android {
  namespace "com.nextimage"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  testOptions {
    unitTests {
      includeAndroidResources = false
      returnDefaultValues = true
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  implementation "io.coil-kt.coil3:coil:$coilVersion"
  implementation "io.coil-kt.coil3:coil-network-core:$coilVersion"
  implementation "io.coil-kt.coil3:coil-network-okhttp:$coilVersion"
  // Coil's default strategy serves a disk entry forever. This one reads the
  // Cache-Control headers NextImage writes, which is what gives `cacheDuration`
  // its meaning on Android.
  implementation "io.coil-kt.coil3:coil-network-cache-control:$coilVersion"

  // Declared explicitly: the cache-control and progress interceptors compile
  // against OkHttp and Okio rather than relying on Coil's transitive graph.
  implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

  testImplementation "junit:junit:4.13.2"
  testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
}
